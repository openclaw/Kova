name: Release Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build release archive
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers \
            verify-tag "${GITHUB_REF_NAME}"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          ci_runs="$(
            gh run list \
              --workflow ci.yml \
              --branch main \
              --event push \
              --commit "$GITHUB_SHA" \
              --limit 20 \
              --json headSha,status,conclusion,databaseId
          )"
          CI_RUNS_JSON="$ci_runs" node <<'NODE'
          const runs = JSON.parse(process.env.CI_RUNS_JSON || "[]");
          const run = runs.find((candidate) => candidate.headSha === process.env.GITHUB_SHA);
          if (!run || run.status !== "completed" || run.conclusion !== "success") {
            throw new Error(`exact-SHA main CI has not passed for ${process.env.GITHUB_SHA}`);
          }
          console.log(`verified exact-SHA CI run ${run.databaseId}`);
          NODE
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install OCM
        run: |
          ./scripts/install-ocm-ci.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ocm" --version
      - name: Install dependencies
        run: npm ci
      - name: Package release archive
        run: ./scripts/package-release.sh --output-dir ./dist
      - name: Smoke install archive
        run: |
          tmp="$(mktemp -d)"
          ./install.sh --archive ./dist/kova.tar.gz --prefix "$tmp/kova" --bin-dir "$tmp/bin" --require-ocm
          (
            cd "$tmp"
            "$tmp/bin/kova" version
            "$tmp/bin/kova" setup --ci --json
            "$tmp/bin/kova" self-check
          )
          rm -rf "$tmp"
      - name: Stage release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kova-release
          path: |
            ./dist/*.tar.gz*
            ./dist/release-metadata.json
          if-no-files-found: error
